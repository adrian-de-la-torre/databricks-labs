name: ci

# Holds no credentials and declares no environment, so it is safe on fork pull
# requests. Everything here runs without touching Azure.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the commit scan at the end.
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # pre-commit is the single definition of the gate. Running it here rather
      # than re-listing the checks is what keeps local and CI from drifting apart.
      - run: pip install pre-commit==4.6.2
      # Authenticated, because tflint fetches the azurerm ruleset from the GitHub
      # releases API and the runner's anonymous quota is shared across every job
      # on that IP. Unauthenticated it fails as "API rate limit exceeded" at
      # random, which reads like a broken pin rather than a shared quota.
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit scans the tree a pull request ends in. On a public repository
      # every commit in it is published too, so an id that one commit adds and
      # the next removes is still out there: the commits are scanned as well,
      # with their messages and authors (ADR-0005).
      #
      # The range ends at the pull request's head rather than HEAD: what is
      # checked out is GitHub's synthetic merge commit, which nobody pushed.
      - name: identifiers in the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scan/identifiers.py --history "origin/${BASE}..${HEAD_SHA}"
