name: infra-apply

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-*.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          targets=$(find infra/stacks -path '*/envs/*.tfvars' \
            | sed -E 's|(.*)/envs/(.*)\.tfvars|{"stack":"\1","target":"\2","environment":"\2"}|' \
            | sed -E 's|"environment":"([a-z]+)\.[a-z]+"|"environment":"\1"|' \
            | jq -sc .)
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  apply:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.targets) }}
    # The environment is what binds this job to the federated credential whose
    # subject ends in :environment:<name>. It is also where a required reviewer
    # would be configured for anything that is not dev.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: apply
        working-directory: ${{ matrix.stack }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -input=false -backend-config="envs/${{ matrix.target }}.tfbackend"
          # Plan and apply in one step against the merged commit. Carrying a plan
          # artefact from the pull request would apply a plan computed against
          # pre-merge state.
          terraform apply -input=false -auto-approve -no-color \
            -var-file="envs/${{ matrix.target }}.tfvars"
