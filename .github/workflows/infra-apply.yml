name: infra-apply

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-*.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-apply
  cancel-in-progress: false

env:
  # The layering order, declared once and in the only place that enforces it.
  #
  # A GitHub matrix does NOT guarantee ordering, even with max-parallel: 1. An
  # earlier version of this workflow generated the matrix with `find` and relied
  # on the job sequence; governance ran before platform and failed on resources
  # that did not exist yet.
  #
  # infra/bootstrap and infra/stacks/account are absent on purpose. Both are
  # applied from a laptop: bootstrap defines the identities CI runs as, and
  # account needs Databricks account admin, which Azure RBAC does not confer.
  STACK_ORDER: platform governance

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          # One job per deployment target; stacks are applied in order INSIDE it.
          targets=$(find infra/stacks/platform/envs -name '*.tfvars' \
            | sed -E 's|.*/envs/(.*)\.tfvars|\1|' \
            | sed -E 's|^([a-z]+)\.[a-z]+$|{"target":"&","environment":"\1"}|' \
            | jq -sc .)
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  apply:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.targets) }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: apply stacks in order
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for stack in ${STACK_ORDER}; do
            dir="infra/stacks/${stack}"
            echo "::group::apply ${stack} (${{ matrix.target }})"
            terraform -chdir="${dir}" init -input=false \
              -backend-config="envs/${{ matrix.target }}.tfbackend"
            # Plan and apply against the merged commit. A plan carried from the
            # pull request would have been computed against pre-merge state.
            terraform -chdir="${dir}" apply -input=false -auto-approve -no-color \
              -var-file="envs/${{ matrix.target }}.tfvars"
            echo "::endgroup::"
          done
